name: Release to Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifest and scripts
        run: |
          python3 -m json.tool manifest.json > /dev/null
          for f in background.js content.js extractor.js markdown.js options.js; do
            node --check "$f"
          done
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            MANIFEST_VER="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
            if [ "$TAG_VER" != "$MANIFEST_VER" ]; then
              echo "Tag version ($TAG_VER) does not match manifest.json version ($MANIFEST_VER)"
              exit 1
            fi
          fi

      - name: Package extension zip
        run: |
          zip -r tweet-slang-explainer.zip \
            manifest.json \
            background.js \
            content.js \
            extractor.js \
            markdown.js \
            options.html \
            options.css \
            options.js \
            icons/ \
            -x "*.DS_Store"

      - name: Upload and publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source tweet-slang-explainer.zip \
            --auto-publish

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: tweet-slang-explainer.zip
          generate_release_notes: true
